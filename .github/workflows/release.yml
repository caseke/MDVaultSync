name: Release

# Builds, attests and drafts a release when a version tag is pushed. The only place release files are built
# (CLAUDE.md, R-SEC-5). Tags have no "v" prefix and must equal the version in the manifest [O-SUB-2], [O-BRAT-1].
# 0.x versions are marked pre-release; BRAT installs pre-releases [O-BRAT-1]. Publishing the draft is manual (T-T8).
#
# Two jobs: "build" runs dev-dependency code with a read-only token and no OIDC; "release" runs no repository
# or npm code and alone holds the write and id-token scopes (T-E4, T-T7).
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag must equal the manifest version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./manifest.json").version')"
          if [ "$TAG" != "$version" ]; then
            echo "::error::tag $TAG does not match manifest.json version $version"
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-fund # no dependency lifecycle scripts (T-T7)
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - name: Forbidden network APIs (R-NET-1)
        run: scripts/check-network-apis.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release-files
      - name: Tag must still point at the built commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          tagged="$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)"
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::tag $TAG moved to $tagged during the run (built $GITHUB_SHA)"
            exit 1
          fi
      - name: Tagged commit must be on main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # "behind" or "identical": the built commit is main or an ancestor of it (T-T8).
          status="$(gh api "repos/$GH_REPO/compare/main...$GITHUB_SHA" --jq .status)"
          if [ "$status" != "behind" ] && [ "$status" != "identical" ]; then
            echo "::error::$GITHUB_SHA is not on main (compare status: $status)"
            exit 1
          fi
      - name: Attest release files [O-REL-1]
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-files/main.js
            release-files/manifest.json
            release-files/styles.css
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          flags="--draft"
          case "$TAG" in 0.*) flags="$flags --prerelease" ;; esac
          gh release create "$TAG" $flags --title "$TAG" --verify-tag \
            --notes "Built and attested by the Release workflow. Verify: gh attestation verify main.js -R $GH_REPO" \
            release-files/main.js release-files/manifest.json release-files/styles.css
